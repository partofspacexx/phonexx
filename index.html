<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>휴대폰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300&display=swap" rel="stylesheet">

<!--
==========
스타일 (CSS)
==========
아래로 디자인 코딩
-->
<style>
/* ====== 색/폰트 설정 ====== */
:root{
  --bg:#000000;
  --text:#ffffff;
  --sub:rgba(255,255,255,.62);
  --widget:rgba(255,255,255,.12);
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --clock-font:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --ui-font:-apple-system,'SF Pro Text','Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--ui-font);color:var(--text)}
button{font-family:inherit;color:inherit}

/* ====== 폰 화면 틀 (393 x 852 고정 비율) ====== */
#phone{
  position:absolute;left:50%;top:50%;overflow:hidden;background:var(--bg);
  width:393px;height:852px;border-radius:48px;
  transform:translate(-50%,-50%) scale(var(--s,1));
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen.hidden{display:none}
svg{display:block}

/* ====== 잠금화면 상태바 ====== */
.status{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 28px 0;font-size:14px;font-weight:600;
}
.status .right{display:flex;gap:6px;align-items:center}
.battery{width:24px;height:12px;border:1.5px solid var(--sub);border-radius:4px;position:relative;padding:1px}
.battery i{display:block;height:100%;width:80%;background:var(--text);border-radius:2px}
.battery::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--sub);border-radius:0 1px 1px 0}

/* ====== 잠금화면 날짜 + 시계 ====== */
.date{text-align:center;margin-top:34px;font-size:19px;font-weight:500;color:var(--sub)}
.clock{
  text-align:center;font-family:var(--clock-font);font-weight:200;
  font-size:168px;line-height:1;letter-spacing:2px;margin-top:2px;
  font-variant-numeric:tabular-nums;
}

/* ====== 잠금화면 하단 위젯 ====== */
.bottom{margin-top:auto;padding:0 20px 14px}
.widget{
  background:var(--widget);border-radius:18px;padding:10px 12px 12px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.widget .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;min-height:18px}
.widget .q{font-size:14px;font-weight:600}
.msg{font-size:12px;color:var(--sub)}
.widget .row{display:flex;gap:8px}
.widget input{
  flex:1;min-width:0;border:0;outline:0;border-radius:10px;padding:9px 12px;
  background:rgba(255,255,255,.14);color:var(--text);font-size:16px;font-family:inherit;
}
.widget input::placeholder{color:var(--sub)}
.widget button{
  border:0;border-radius:10px;padding:0 16px;
  background:var(--text);color:#000;font-size:15px;font-weight:600;cursor:pointer;
}
.widget button:active{opacity:.75}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.shortcuts{display:flex;justify-content:space-between;padding:26px 28px 10px}
.circle{
  width:50px;height:50px;border-radius:50%;background:var(--widget);
  display:flex;align-items:center;justify-content:center;
}
.circle svg{width:22px;height:22px;fill:none;stroke:var(--text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.home-bar{width:134px;height:5px;border-radius:3px;background:var(--text);margin:8px auto 0;opacity:.9}

/* ====== 로딩창 ====== */
#loading{
  position:absolute;inset:0;background:rgba(0,0,0,.82);z-index:10;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
#loading.show{display:flex}
.spinner{
  width:38px;height:38px;border-radius:50%;
  border:3px solid rgba(255,255,255,.2);border-top-color:var(--text);
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:16px;color:var(--sub)}

/* ====== 최상단 상태바 (홈/앱 공통) ====== */
#status{
  position:absolute;top:0;left:0;right:0;z-index:30;pointer-events:none;
  display:flex;justify-content:space-between;align-items:center;
  height:54px;padding:6px 34px 0 40px;
}
#status.hidden{display:none}
#sbTime{font-size:17px;font-weight:600;letter-spacing:.2px}
.sb-right{display:flex;align-items:center;gap:6px}
.sb-right svg{fill:var(--text)}
.sb-right .wifi{fill:none;stroke:var(--text);stroke-width:1.9;stroke-linecap:round}
.batt{
  position:relative;width:28px;height:14px;border-radius:4.5px;
  background:rgba(255,255,255,.35);overflow:hidden;
}
.batt .fill{position:absolute;left:0;top:0;bottom:0;background:var(--text);border-radius:4.5px}
.batt .fill.low{background:var(--red)}
.batt b{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;color:#000;letter-spacing:-.2px;
}
.nub{width:1.8px;height:5px;background:rgba(255,255,255,.4);border-radius:0 1px 1px 0;margin-left:-4px}

/* ====== 홈화면 ====== */
#home{background:#000}
.apps{flex:1}                      /* 중간 아이콘이 들어갈 자리 (지금은 비어 있음) */
.search{
  align-self:center;display:flex;align-items:center;gap:6px;
  padding:9px 20px;border-radius:20px;background:rgba(255,255,255,.22);
  font-size:15px;font-weight:500;color:rgba(255,255,255,.85);
  pointer-events:none;user-select:none;margin-bottom:14px;
}
.search svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.dock{
  margin:0 12px 14px;height:97px;border-radius:34px;padding:0 18px;
  background:rgba(255,255,255,.26);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;align-items:center;
}
.icon{
  width:60px;height:60px;border-radius:14px;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon:active{filter:brightness(.8)}
.icon-phone{background:linear-gradient(#67e06e,#2fb83b)}
.icon-phone svg{width:34px;height:34px;fill:#fff}

/* ====== 전화 앱 ====== */
#phoneApp{background:#000;padding-top:54px}
.panel{flex:1;min-height:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.panel.on{display:flex}
.empty{font-size:16px;color:var(--sub)}
.tabbar{
  display:flex;justify-content:space-around;height:58px;padding-top:6px;
  background:#161616;border-top:1px solid rgba(255,255,255,.12);
}
.tab{
  background:none;border:0;width:90px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:500;color:rgba(255,255,255,.5);cursor:pointer;
}
.tab svg{width:25px;height:25px;fill:currentColor}
.tab.on{color:var(--blue)}
.app-home{
  height:28px;background:#161616;display:flex;justify-content:center;align-items:flex-end;
  padding-bottom:8px;cursor:pointer;
}
.app-home i{display:block;width:134px;height:5px;border-radius:3px;background:var(--text)}

/* 키패드 */
#numDisplay{height:56px;font-size:38px;font-weight:400;letter-spacing:.5px;margin-bottom:34px;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:14px 22px}
.key{
  width:78px;height:78px;border-radius:50%;border:0;background:#333;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.key:active{background:#6a6a6c}
.key .n{font-size:34px;font-weight:300;line-height:1}
.key .l{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text);height:12px;margin-top:2px}
.callrow{display:grid;grid-template-columns:repeat(3,78px);gap:22px;margin-top:16px}
.callrow>*{grid-column:2}
.call-btn{
  width:78px;height:78px;border-radius:50%;border:0;background:var(--green);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.call-btn:active{filter:brightness(.8)}
.call-btn svg{width:36px;height:36px;fill:#fff}
.del{
  grid-column:3;grid-row:1;align-self:center;justify-self:center;
  width:78px;height:78px;border:0;background:none;cursor:pointer;visibility:hidden;
  display:flex;align-items:center;justify-content:center;
}
.del.show{visibility:visible}
.del svg{width:30px;height:30px;fill:#555;stroke:none}
.del svg .x{stroke:#000;stroke-width:1.8;stroke-linecap:round}

/* ====== 문자 앱 ====== */
.icon{position:relative}
.icon-msg{background:linear-gradient(#67e06e,#2fb83b)}
.icon-msg svg{width:36px;height:36px;fill:#fff}
.badge{
  position:absolute;top:-9px;right:-9px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;
  background:#ff3b30;color:#fff;font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.badge[hidden]{display:none}
#msgApp{background:#000;padding-top:54px}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.on{display:flex}
.m-title{font-size:34px;font-weight:700;padding:6px 16px 10px}
.m-rows{flex:1;overflow-y:auto}
.m-empty{text-align:center;margin-top:120px;font-size:16px;color:var(--sub)}
.m-row{
  position:relative;display:flex;align-items:center;gap:8px;width:100%;
  padding:10px 16px 10px 8px;background:none;border:0;text-align:left;cursor:pointer;
}
.m-row::after{content:"";position:absolute;left:78px;right:0;bottom:0;height:1px;background:rgba(255,255,255,.12)}
.m-row:active{background:rgba(255,255,255,.08)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none;visibility:hidden}
.dot.on{visibility:visible}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;
  background:linear-gradient(#a3a4aa,#76777d);display:flex;align-items:center;justify-content:center;
}
.avatar svg{width:28px;height:28px;fill:#e9e9ee}
.avatar.sm{width:38px;height:38px}
.avatar.sm svg{width:24px;height:24px}
.m-text{flex:1;min-width:0}
.m-line{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.m-name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-time{font-size:15px;color:var(--sub);flex:none}
.m-prev{
  margin-top:2px;font-size:15px;line-height:1.3;color:var(--sub);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.t-head{
  position:relative;height:76px;flex:none;background:#161616;border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.t-head .back{
  position:absolute;left:10px;top:24px;background:none;border:0;cursor:pointer;
  font-size:17px;color:var(--blue);
}
#tName{font-size:11px;color:var(--text)}
.t-body{
  flex:1;overflow-y:auto;padding:8px 14px 12px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none;
}
.t-body::-webkit-scrollbar{display:none}
.t-time{align-self:center;font-size:12px;color:var(--sub);margin:12px 0 6px}
.b{max-width:76%;padding:8px 13px;border-radius:19px;font-size:16.5px;line-height:1.3;word-break:break-word;white-space:pre-wrap}
.b.them{align-self:flex-start;background:#262629}
.b.me{align-self:flex-end;background:var(--blue)}
.typing{align-self:flex-start;background:#262629;border-radius:19px;padding:13px 15px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.t-input{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#161616;flex:none}
.t-input input{
  flex:1;min-width:0;border:1px solid rgba(255,255,255,.25);outline:0;border-radius:19px;
  padding:8px 14px;background:transparent;color:var(--text);font-size:16px;font-family:inherit;
}
.t-input input::placeholder{color:var(--sub)}
.t-input button{
  width:32px;height:32px;border-radius:50%;border:0;background:var(--blue);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;opacity:.35;
}
.t-input button.on{opacity:1}
.t-input svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ====== 프로필 동그라미 (이름 첫 글자) ====== */
.avatar{font-size:20px;font-weight:500;color:#fff}
.avatar.sm{font-size:16px}
.avatar.lg{width:100px;height:100px;font-size:46px;margin-top:6px}

/* ====== 전화번호부 ====== */
#p-contacts{align-items:stretch;justify-content:flex-start}
.cview{display:none;flex:1;flex-direction:column;min-height:0}
.cview.on{display:flex}
.c-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.c-scroll::-webkit-scrollbar{display:none}
.c-sec{padding:5px 16px;font-size:13px;font-weight:600;color:var(--sub);background:#1c1c1e}
.c-row{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:8px 16px;background:none;border:0;text-align:left;cursor:pointer;
}
.c-row::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:rgba(255,255,255,.12)}
.c-row:active{background:rgba(255,255,255,.08)}
.c-name{font-size:17px;font-weight:500}
.back-link{align-self:flex-start;background:none;border:0;color:var(--blue);font-size:17px;padding:10px 12px;cursor:pointer}
.cd-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:20px;scrollbar-width:none}
.cd-scroll::-webkit-scrollbar{display:none}
.cd-name{font-size:28px;font-weight:600;margin:12px 0 18px;text-align:center;padding:0 16px}
.cd-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:calc(100% - 32px)}
.act{
  height:62px;border:0;border-radius:12px;background:#1c1c1e;color:var(--blue);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;
}
.act svg{width:22px;height:22px;fill:currentColor;stroke:none}
.act svg.line{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act:active{filter:brightness(.7)}
.act:disabled{opacity:.4;cursor:default;filter:none}
.card{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  width:calc(100% - 32px);margin:12px 16px 0;padding:12px 16px;
  background:#1c1c1e;border:0;border-radius:12px;text-align:left;cursor:pointer;color:var(--text);
}
.card:active{filter:brightness(.7)}
.card .lbl{font-size:13px}
.card .val{font-size:17px;color:var(--blue)}
.card.link{color:var(--blue);font-size:17px}

/* ====== 기록 ====== */
#p-log{align-items:stretch;justify-content:flex-start}
.l-row{position:relative;display:flex;align-items:center;gap:12px;padding:8px 16px}
.l-row::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:rgba(255,255,255,.12)}
.l-text{flex:1;min-width:0}
.l-name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-name.missed{color:var(--red)}
.l-sub{display:flex;align-items:center;gap:5px;margin-top:1px;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden}
.l-sub svg{width:13px;height:13px;fill:currentColor;flex:none}
.l-sub span{overflow:hidden;text-overflow:ellipsis}
.l-time{font-size:14px;color:var(--sub);flex:none}

/* ====== 상태바: 밝은 화면(카카오톡)에서는 검은 글씨 ====== */
#status{transition:color .15s}
#status.dark{color:#000}
#status.dark .sb-right svg{fill:#000}
#status.dark .sb-right .wifi{fill:none;stroke:#000}
#status.dark .batt{background:rgba(0,0,0,.2)}
#status.dark .batt .fill{background:#000}
#status.dark .batt .fill.low{background:var(--red)}
#status.dark .batt b{color:#fff}
#status.dark .nub{background:rgba(0,0,0,.35)}

/* ====== 독 아이콘: 카카오톡 / 카메라 ====== */
.icon-kakao{background:#fee500}
.icon-kakao svg{width:38px;height:38px}
.icon-cam{background:linear-gradient(#d6d6db,#8c8c92)}
.icon-cam svg{width:36px;height:36px}

/* ====== 카카오톡 ====== */
#kakaoApp{background:#fff;color:#111;padding-top:54px}
.k-body{flex:1;min-height:0;display:flex;flex-direction:column}
.k-page{display:none;flex:1;min-height:0;flex-direction:column}
.k-page.on{display:flex}
.k-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 8px;flex:none}
.k-head h1{font-size:25px;font-weight:700}
.k-icons{display:flex;gap:18px}
.k-icons span{position:relative;display:block}
.k-icons svg{width:22px;height:22px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.k-icons .rd::after{content:"";position:absolute;top:-3px;right:-4px;width:6px;height:6px;border-radius:50%;background:#ff4a2e}
.k-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.k-scroll::-webkit-scrollbar{display:none}

.k-row{display:flex;align-items:center;gap:12px;padding:8px 18px}
.k-row .avatar{width:48px;height:48px;font-size:19px}
.k-me .avatar{width:56px;height:56px;font-size:22px}
.k-n{font-size:16px;font-weight:600}
.k-me .k-n{font-size:17px}
.k-st{font-size:13px;color:#8a8a8a}
.k-me .k-tx{flex:1;min-width:0}
.k-me .k-st{margin-top:2px}
.k-fr .k-n{flex:none}
.k-fr .k-st{margin-left:auto;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-sec{margin:6px 18px 0;padding:10px 0 4px;font-size:12.5px;color:#8a8a8a;border-top:1px solid #eee}
.k-empty{text-align:center;margin-top:120px;font-size:15px;color:#999}

.k-chat{display:flex;align-items:center;gap:12px;width:100%;padding:10px 18px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.k-chat:active{background:#f3f3f3}
.k-chat .avatar{width:50px;height:50px;font-size:20px}
.k-ct{flex:1;min-width:0}
.k-cn{font-size:16px;font-weight:600}
.k-cp{margin-top:2px;font-size:14px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-cr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;align-self:flex-start;padding-top:2px}
.k-ctime{font-size:12px;color:#999}
.k-cbadge{min-width:20px;height:20px;border-radius:10px;background:#ff4a2e;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}

.k-tabbar{display:flex;justify-content:space-around;height:58px;flex:none;background:#fff;border-top:1px solid #eee}
.k-tab{position:relative;background:none;border:0;width:90px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#c6c6c6}
.k-tab.on{color:#111}
.k-tab svg{width:30px;height:30px;fill:currentColor}
.k-tbadge{
  position:absolute;top:7px;left:50%;margin-left:6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  background:#ff4a2e;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.k-tbadge[hidden]{display:none}
.app-home.k-home{background:#fff}
.app-home.k-home i{background:#000}

/* 환경설정 (더보기) */
#k-more{background:#f4f4f4}
.k-chips{display:flex;gap:8px;padding:2px 18px 12px}
.chip{padding:10px 18px;border-radius:21px;background:#e6e6e7;font-size:16px;font-weight:600;color:#444}
.chip.on{background:#1e1e1e;color:#fff}
.pay{margin:0 18px 12px;padding:15px 16px;border-radius:16px;background:#fee500;display:flex;align-items:center}
.pay .logo{display:flex;align-items:center;gap:3px;font-weight:800;font-size:19px}
.pay .logo svg{width:20px;height:20px;fill:#111}
.pay b{font-size:19px;margin-left:10px}
.pay .acts{margin-left:auto;display:flex;font-size:14px;font-weight:600}
.pay .acts span{padding:0 10px}
.pay .acts span+span{border-left:1px solid rgba(0,0,0,.14)}
.pay .acts span:last-child{padding-right:0}
.k-card{margin:0 18px 12px;background:#fff;border-radius:18px;padding:12px 6px}
.m-grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:4px}
.m-it{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;font-size:12px;color:#222}
.m-it svg{width:30px;height:30px;fill:none;stroke:#222;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.m-it.hasdot::after{content:"";position:absolute;top:6px;left:calc(50% + 15px);width:5px;height:5px;border-radius:50%;background:#ff4a2e}
.pg{display:flex;justify-content:center;gap:5px;padding:6px 0 2px}
.pg i{width:6px;height:6px;border-radius:3px;background:#c4c4c4}
.pg i:first-child{width:16px;background:#222}
.ad{margin:0 18px 14px;background:#fff;border-radius:18px;padding:14px 16px}
.ad-h{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid #eee;font-size:14px}
.ad-i{width:26px;height:26px;border-radius:7px;background:#3c1e1e;color:#fee500;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.ad-h .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-b{font-size:11px;font-weight:600;color:#888;background:#efefef;border-radius:12px;padding:3px 8px}
.ad-item{display:flex;align-items:center;gap:12px;padding-top:12px;color:inherit;text-decoration:none}
.ad-th{width:78px;height:78px;border-radius:10px;background:#efefef center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:26px;color:#a0a0a0;flex:none}
.ad-tx{flex:1;font-size:15px;line-height:1.35}
.ad-item svg{width:18px;height:18px;fill:none;stroke:#aaa;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ad-item:active{opacity:.7}

/* 카카오톡 대화방 */
.k-room{position:absolute;left:0;right:0;top:0;bottom:28px;z-index:5;background:#b2c7da;display:none;flex-direction:column;padding-top:54px}
.k-room.on{display:flex}
.k-rhead{display:flex;align-items:center;gap:6px;padding:6px 18px 10px 12px;flex:none}
.k-rhead>button{background:none;border:0;font-size:30px;line-height:1;color:#111;cursor:pointer;padding:0 8px 4px 0}
.k-rname{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-rbody{flex:1;overflow-y:auto;padding:4px 12px 12px;scrollbar-width:none}
.k-rbody::-webkit-scrollbar{display:none}
.k-date{margin:12px auto 10px;width:fit-content;padding:4px 14px;border-radius:12px;background:rgba(0,0,0,.2);color:#fff;font-size:11.5px}
.k-msg{display:flex;gap:8px;margin-top:5px;align-items:flex-start}
.k-msg.me{justify-content:flex-end}
.k-msg .avatar{width:38px;height:38px;font-size:16px;flex:none}
.k-col{display:flex;flex-direction:column;max-width:80%}
.k-who{font-size:13px;color:#333;margin-bottom:4px}
.k-line{display:flex;align-items:flex-end;gap:5px}
.k-bub{max-width:215px;padding:8px 11px;border-radius:12px;font-size:15px;line-height:1.35;word-break:break-word;white-space:pre-wrap;color:#000}
.k-msg.them .k-bub{background:#fff}
.k-msg.me .k-bub{background:#fee500}
.k-tm{font-size:10.5px;color:rgba(0,0,0,.55);flex:none;white-space:nowrap}
.k-typing{display:flex;gap:4px;background:#fff;border-radius:12px;padding:12px 14px;width:fit-content;margin:5px 0 0 46px}
.k-typing i{width:7px;height:7px;border-radius:50%;background:#999;animation:blink 1.2s infinite}
.k-typing i:nth-child(2){animation-delay:.2s}
.k-typing i:nth-child(3){animation-delay:.4s}
.k-rin{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;flex:none}
.k-rin .plus{width:28px;height:28px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;flex:none}
.k-rin .plus svg{width:14px;height:14px;stroke:#555;stroke-width:2;stroke-linecap:round}
.k-rin input{flex:1;min-width:0;border:0;outline:0;background:#f2f2f2;border-radius:18px;padding:9px 14px;font-size:16px;font-family:inherit;color:#111}
.k-rin button{width:34px;height:34px;border-radius:50%;border:0;background:#e9e9e9;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.k-rin button.on{background:#fee500}
.k-rin button svg{width:18px;height:18px;fill:none;stroke:#111;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ====== 카메라 ====== */
#cameraApp{background:#000;padding-top:54px}
.cam-top{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px}
.cam-top svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vf{position:relative;width:100%;height:524px;flex:none;overflow:hidden;background:#161616 center/cover no-repeat}
.vf .grid{
  position:absolute;inset:0;
  background:
    linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 33.33% 0/1px 100% no-repeat,
    linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 66.66% 0/1px 100% no-repeat,
    linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 33.33%/100% 1px no-repeat,
    linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)) 0 66.66%/100% 1px no-repeat;
}
.vf .zoom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);color:#ffd60a;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .3s}
.flash.on{opacity:.9;transition:none}
.modes{display:flex;justify-content:center;gap:16px;height:38px;flex:none;align-items:center;font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.modes .on{color:#ffd60a}
.cam-ctl{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 36px}
.thumb{width:48px;height:48px;border-radius:10px;background:#2a2a2c center/cover no-repeat}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:none;padding:4px;cursor:pointer}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .08s}
.shutter:active i{transform:scale(.88)}
.flip{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.flip svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-home.cam-home{background:#000}

.avatar.kav{background:#acbfee center/cover no-repeat;border-radius:36%}
.avatar.kav svg{width:100%;height:100%;fill:none}

/* ====== 카카오 환경설정 보강 ====== */
.k-head h1.big{font-size:31px}
.pay .acts .sc{display:flex;align-items:center;gap:4px}
.pay .acts .sc svg{width:16px;height:16px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.k-now{margin:6px 18px 26px}
.k-now h2{font-size:21px;font-weight:700;margin:6px 0 12px}
.k-now-row{display:flex;gap:10px}
.k-now-row span{flex:1;height:112px;border-radius:14px;background:#e9e9ea}

/* ====== 홈화면: 위젯 + 앱 아이콘 ====== */
.apps{position:relative}
.hwrap{position:absolute;left:27px;right:27px;top:78px;display:flex;justify-content:space-between}
.wg{width:158px;height:158px;border-radius:24px;overflow:hidden}
.wg-l{margin-top:6px;text-align:center;font-size:12px;color:#fff}
.wg-c{background:#fff;color:#000;padding:13px 16px;display:flex;flex-direction:column}
.wg-c b{font-size:14px;font-weight:700}
.wg-c span{font-size:50px;font-weight:300;line-height:1.05}
.wg-c em{margin-top:auto;font-style:normal;font-size:15px;color:#8a8a8e;line-height:1.3;max-height:40px;overflow:hidden;white-space:pre-line}
.wg-m{background:linear-gradient(#34343a,#1f1f24);color:#fff;padding:12px 14px;display:flex;flex-direction:column}
.mw-top{display:flex;justify-content:space-between;align-items:center}
.mw-cover{width:40px;height:40px;border-radius:9px;background:#e0526b;display:flex;align-items:center;justify-content:center}
.mw-cover svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mw-play{width:36px;height:36px;border-radius:50%;border:0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mw-play svg{width:16px;height:16px;fill:#111}
.mw-t{margin-top:9px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-a{margin-top:1px;font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw-bar{margin-top:auto;height:16px;display:flex;align-items:center;cursor:pointer}
.mw-trk{display:block;position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.mw-trk i{display:block;height:100%;width:0;background:#fff}
.mw-times{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.hgrid{position:absolute;left:30px;right:30px;top:275px;display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;row-gap:16px}
.hi{display:flex;flex-direction:column;align-items:center;gap:6px}
.hl{font-size:12px;color:#fff;white-space:nowrap;line-height:16px}
.appic{overflow:hidden;flex-direction:column}
.appic svg{width:60px;height:60px;display:block}
.appic.dis{pointer-events:none;cursor:default}
#ytHost{position:absolute;left:-300px;top:0;width:200px;height:200px;opacity:0;pointer-events:none}

/* ====== 앱 화면 공통 (인터넷 · 유튜브 · 갤러리 · QNA) ====== */
#genApp{--gbg:#fff;--gtx:#111;--gcard:#f4f4f6;--gsub:#8a8a8e;--gsep:rgba(0,0,0,.1);--acc:#e5322e;background:var(--gbg);color:var(--gtx);padding-top:54px}
#genApp.pink{--gbg:#fff1f6;--gcard:#fff;--acc:#ff5c9a}
#genApp .app-home{background:var(--gbg)}
#genApp .app-home i{background:var(--gtx)}
.ga-body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.ga-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.ga-scroll::-webkit-scrollbar{display:none}
.ga-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 44px 40px}
.ga-empty b{font-size:18px;font-weight:600}
.ga-empty span{font-size:14px;color:var(--gsub)}
.ga-tabs{display:flex;justify-content:space-around;align-items:center;height:56px;flex:none;background:var(--gbg);border-top:1px solid var(--gsep)}
.ga-tab{background:none;border:0;color:var(--gsub);font-size:12px;font-weight:600;padding:8px 6px;flex:1;font-family:inherit;pointer-events:none}
.ga-tab.on{color:var(--gtx)}
.ga-back{background:none;border:0;color:var(--acc);font-size:17px;padding:8px 14px;cursor:pointer;font-family:inherit;align-self:flex-start;flex:none}

/* 인터넷 */
.in-addr{margin:6px 14px 8px;padding:9px 14px;border-radius:20px;background:#f1f1f3;font-size:14px;color:#555;display:flex;align-items:center;gap:8px;flex:none}
.in-addr svg{width:13px;height:13px;fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.in-logo{text-align:center;font-size:88px;font-weight:900;color:var(--acc);line-height:1;margin:28px 0 20px;letter-spacing:-2px}
.in-search{display:flex;gap:8px;margin:0 18px}
.in-search input{flex:1;min-width:0;border:2px solid var(--acc);border-radius:24px;padding:11px 16px;font-size:16px;outline:0;font-family:inherit;color:#111;background:#fff}
.in-search button{border:0;border-radius:24px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;padding:0 18px;font-family:inherit;cursor:pointer}
.in-sec{margin:28px 18px 4px;font-size:15px;font-weight:700;color:var(--acc);display:flex;align-items:center;gap:7px}
.in-sec::before{content:"";width:4px;height:16px;background:var(--acc);border-radius:2px}
.in-art{display:block;width:calc(100% - 36px);margin:0 18px;padding:14px 0;background:none;border:0;border-bottom:1px solid var(--gsep);text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.in-art b{display:block;font-size:16px;line-height:1.4}
.in-art span{display:block;margin-top:5px;font-size:12px;color:var(--gsub)}
.in-bar{display:flex;justify-content:space-around;align-items:center;height:48px;flex:none;border-top:1px solid var(--gsep);color:#a0a0a6;font-size:22px}
.in-h{font-size:21px;font-weight:800;padding:4px 18px 10px}
.in-hist{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--gsep);font-size:16px}
.in-hist svg{width:18px;height:18px;fill:none;stroke:#a0a0a6;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.in-at{font-size:22px;font-weight:800;line-height:1.35;padding:6px 18px 8px}
.in-am{padding:0 18px 14px;font-size:12px;color:var(--gsub);border-bottom:1px solid var(--gsep)}
.in-ab{padding:16px 18px 22px;font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.in-ch{padding:12px 18px;font-size:15px;font-weight:700;border-top:8px solid #f1f1f3;border-bottom:1px solid var(--gsep)}
.in-ch b{color:var(--acc)}
.in-c{padding:12px 18px;border-bottom:1px solid var(--gsep)}
.in-c .n{font-size:13px;font-weight:700}
.in-c .t{font-size:15px;line-height:1.5;margin-top:3px;word-break:break-word}
.in-c .l{font-size:12px;color:var(--gsub);margin-top:5px}

/* 유튜브 */
.yt-top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;flex:none}
.yt-top b{font-size:21px;font-weight:800}
.yt-ic{display:flex;gap:18px}
.yt-ic svg{width:22px;height:22px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.yt-chips{display:flex;gap:8px;padding:2px 14px 12px;overflow-x:auto;flex:none;scrollbar-width:none}
.yt-chips span{white-space:nowrap;padding:7px 13px;border-radius:9px;background:#f0f0f2;font-size:14px;font-weight:600}
.yt-chips span.on{background:#111;color:#fff}
.yt-v{display:block;width:100%;background:none;border:0;padding:0 0 20px;text-align:left;font-family:inherit;color:inherit;cursor:default}
.yt-v.link{cursor:pointer}
.yt-th{position:relative;width:100%;aspect-ratio:16/9;background:#888}
.yt-len{position:absolute;right:8px;bottom:9px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px}
.yt-pg{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.45)}
.yt-pg i{display:block;height:100%;background:#f03}
.yt-info{display:flex;gap:10px;padding:10px 14px 0}
.yt-av{width:36px;height:36px;border-radius:50%;background:#c9c9d0;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:700}
.yt-t{font-size:15px;font-weight:600;line-height:1.35}
.yt-m{font-size:12px;color:var(--gsub);margin-top:3px}

/* 갤러리 */
.gl-top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;flex:none}
.gl-top b{font-size:24px;font-weight:700}
.gl-d{padding:14px 16px 8px;font-size:14px;font-weight:600;color:#444}
.gl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gl-p{aspect-ratio:1;background:#2f6fe4 center/cover no-repeat}

/* QNA 앱 */
.cp-intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-size:21px;font-weight:700;color:#d6336c;padding-bottom:60px}
.cp-spin{width:40px;height:40px;border-radius:50%;border:4px solid #ffd0e1;border-top-color:var(--acc);animation:spin .9s linear infinite}
.cp-h{font-size:24px;font-weight:800;padding:10px 20px 14px;color:#d6336c}
.cp-card{background:#fff;border-radius:18px;margin:0 18px 14px;padding:18px;box-shadow:0 2px 10px rgba(255,92,154,.12)}
.cp-q{font-size:17px;font-weight:700;line-height:1.45}
.cp-card textarea{width:100%;height:130px;margin-top:14px;border:2px solid #ffd0e1;border-radius:14px;padding:12px;font-size:16px;font-family:inherit;resize:none;outline:0;color:#111}
.cp-card textarea:focus{border-color:var(--acc)}
.cp-btn{display:block;width:calc(100% - 36px);margin:4px 18px 0;padding:14px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
.cp-btn:disabled{opacity:.4;cursor:default}
.cp-a{margin-top:8px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.cp-a.none{color:#9a9aa0}


#genApp.dark{--gbg:#000;--gtx:#fff;--gcard:#1c1c1e;--gsub:#8e8e93;--gsep:rgba(255,255,255,.14);--acc:#0a84ff}
.ga-tab.act{pointer-events:auto;cursor:pointer}
.ga-main{flex:1;min-height:0;display:flex;flex-direction:column}
.ga-title{font-size:32px;font-weight:700;padding:8px 20px 10px;flex:none}
.ga-card{background:var(--gcard);border-radius:12px;margin:0 16px 14px;overflow:hidden;flex:none}
.ga-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;font-size:17px;background:none;border:0;color:inherit;text-align:left;font-family:inherit}
.ga-row+.ga-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--gsep)}
.ga-row .l{flex:1;min-width:0}
.ga-row .val{margin-left:auto;color:var(--gsub);font-size:15px}
.ga-row .chev{margin-left:auto;color:var(--gsub);font-size:20px}
.ga-row .val+.chev{margin-left:8px}
.nt-s{font-size:14px;color:var(--gsub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yt-player{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:none}
.yt-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;color:#fff;font-size:14px;line-height:1.5;pointer-events:none}
.yt-wi{padding:12px 16px}
.yt-wi b{display:block;font-size:18px;line-height:1.4}
.yt-wi span{display:block;margin-top:4px;font-size:13px;color:var(--gsub)}

/* 시계 */
.clk .l{flex:1}
.clk .c{font-size:20px}
.clk .s{font-size:13px;color:var(--gsub);margin-top:2px}
.clk .t{font-size:40px;font-weight:300}
.clk .t small{font-size:19px;margin-right:4px}
.sw{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:none;border:0;padding:0;margin-left:auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:#30d158}
.sw.on::after{left:22px}
button.sw{cursor:pointer}
.al-t{font-size:44px;font-weight:300}
.al-t small{font-size:22px;margin-right:4px}
.off{color:var(--gsub)}
.sw-d{font-size:74px;font-weight:200;text-align:center;font-variant-numeric:tabular-nums;padding:36px 0 26px;flex:none}
.sw-bs{display:flex;justify-content:space-between;padding:0 26px 18px;flex:none}
.sw-b{width:84px;height:84px;border-radius:50%;border:0;font-size:17px;font-weight:500;cursor:pointer;font-family:inherit;color:#fff}
.sw-b.gray{background:#333}
.sw-b.green{background:#1b5e2b;color:#30d158}
.sw-b.red{background:#5e1b1b;color:#ff453a}
.sw-b:disabled{opacity:.45;cursor:default}
.lap{display:flex;justify-content:space-between;padding:10px 20px;font-size:17px;border-top:1px solid var(--gsep);font-variant-numeric:tabular-nums}
.tm-in{display:flex;justify-content:center;gap:10px;padding:0 20px 20px;flex:none}
.tm-in label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--gsub)}
.tm-in input{width:74px;height:56px;border-radius:12px;border:0;background:var(--gcard);color:var(--gtx);font-size:26px;text-align:center;font-family:inherit;outline:0}

/* 설정 */
.st-i{width:29px;height:29px;border-radius:7px;flex:none}
.st-av{width:58px;height:58px;border-radius:50%;background:linear-gradient(#a3a4aa,#76777d);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;color:#fff}

.mp{flex:1;position:relative;overflow:hidden;background:#ece8dc}
.mp svg{position:absolute;inset:0;width:100%;height:100%}
.mp-s{position:absolute;left:0;right:0;bottom:0;background:var(--gcard);border-radius:16px 16px 0 0;padding:10px 16px 20px;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
.mp-s::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:#c9c9cd;margin:0 auto 10px}
.mp-s div{background:#e5e5ea;border-radius:10px;padding:10px 12px;color:#8a8a8e;font-size:17px}
.mp-t{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 12px;font-size:12px;color:#555}

/* ====== 통화 화면 ====== */
#call{background:#111;align-items:center}
.call-top{margin-top:130px;text-align:center}
#callName{font-size:34px;font-weight:400}
#callSub{margin-top:8px;font-size:18px;color:var(--sub)}
.call-line{
  margin-top:70px;min-height:60px;padding:0 36px;text-align:center;
  font-size:20px;line-height:1.5;
}
.end-btn{
  position:absolute;bottom:90px;left:50%;margin-left:-36px;
  width:72px;height:72px;border-radius:50%;border:0;background:var(--red);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.end-btn svg{width:34px;height:34px;fill:#fff;transform:rotate(135deg)}

@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}.shake{animation:none}.typing i,.k-typing i{animation:none;opacity:.7}}
</style>

<body>
<div id="phone">

<!--
==========
최상단 (상태바: 시계 / 신호 / 와이파이 / 배터리)
==========
아래로 상태바 코딩 (홈화면과 앱 화면에서 공통으로 보임)
-->
<div id="status" class="hidden">
  <span id="sbTime">0:00</span>
  <span class="sb-right">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg class="wifi" width="17" height="13" viewBox="0 0 16 12"><path d="M1.2 4.2A9.5 9.5 0 0 1 14.8 4.2"/><path d="M3.6 6.8A6 6 0 0 1 12.4 6.8"/><path d="M6 9.2A2.6 2.6 0 0 1 10 9.2"/></svg>
    <span class="batt"><span class="fill" id="battFill"></span><b id="battNum">100</b></span><i class="nub"></i>
  </span>
</div>

<!--
==========
잠금화면
==========
아래로 잠금화면 코딩
-->
<section id="lock" class="screen">

  <!-- ====== 상태바 ====== -->
  <div class="status">
    <span>KT</span>
    <span class="right">
      <span>5G</span>
      <span class="battery"><i></i></span>
    </span>
  </div>

  <!-- ====== 날짜 + 시계 (현재 시각 자동 연동) ====== -->
  <div class="date" id="date"></div>
  <div class="clock" id="clock">00:00</div>

  <!-- ====== 하단: 질문 위젯 ====== -->
  <div class="bottom">
    <div class="widget" id="widget">
      <div class="top">
        <div class="q">이름을 입력하세요.</div>   <!-- ← 질문 문구 수정 -->
        <div id="msg" class="msg" role="alert"></div>
      </div>
      <div class="row">
        <input id="answer" type="text" placeholder="여기에 입력" autocomplete="off" enterkeyhint="done">
        <button id="submit" type="button">최적화</button>
      </div>
    </div>

    <div class="shortcuts">
      <div class="circle">
        <svg viewBox="0 0 24 24"><path d="M8 3h8l-1 5H9z"/><path d="M9 8v4l3 9 3-9V8"/></svg>
      </div>
      <div class="circle">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </div>
    </div>
    <div class="home-bar"></div>
  </div>

  <!-- ====== 로딩창 ====== -->
  <div id="loading">
    <div class="spinner"></div>
    <p>최적화 중...</p>
  </div>
</section>

<!--
==========
홈화면
==========
아래로 홈화면 코딩 (배경화면은 이름별로 JS에서 적용됨)
-->
<section id="home" class="screen hidden">

  <!-- ====== 중간: 아이콘 자리 (나중에 추가) ====== -->
  <div class="apps" id="homeApps"></div>

  <!-- ====== 검색 (보이기만 하고 눌리지 않음) ====== -->
  <div class="search" aria-disabled="true">
    <svg viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l4 4"/></svg>
    검색
  </div>

  <!-- ====== 하단 독 ====== -->

    <button class="icon icon-phone" id="openPhone" type="button" aria-label="전화">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
    </button>
    <button class="icon icon-msg" id="openMsg" type="button" aria-label="문자">
      <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2.5 6.6 2.5 11c0 2.5 1.4 4.7 3.6 6.1-.1 1.2-.7 2.4-1.6 3.2 2-.1 3.7-.8 4.8-1.8.9.2 1.8.3 2.7.3 5.5 0 9.5-3.6 9.5-7.8S17.5 3 12 3z"/></svg>
      <span class="badge" id="msgBadge" hidden>0</span>
    </button>
    <button class="icon icon-kakao" id="openKakao" type="button" aria-label="카카오톡">
      <svg viewBox="0 0 24 24"><path fill="#3c1e1e" d="M12 3.5C6.8 3.5 2.6 6.8 2.6 10.9c0 2.6 1.7 4.9 4.3 6.2l-1 3.6c-.1.3.3.5.5.4l4.3-2.8c.4.1.9.1 1.3.1 5.2 0 9.4-3.3 9.4-7.4S17.2 3.5 12 3.5z"/></svg>
      <span class="badge" id="kakaoBadge" hidden>0</span>
    </button>
    <button class="icon icon-cam" id="openCam" type="button" aria-label="카메라">
      <svg viewBox="0 0 24 24"><path fill="#1c1c1e" d="M4 7.5h3l1.4-2.2h7.2L17 7.5h3a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4" fill="none" stroke="#a9a9ae" stroke-width="1.6"/></svg>
    </button>
  </div>
</section>

<!--
==========
전화
==========
아래로 전화 앱 코딩 (키패드 / 기록 / 전화번호부)
-->
<section id="phoneApp" class="screen hidden">

  <!-- ====== 기록 ====== -->
  <div class="panel" id="p-log">
    <h1 class="m-title">기록</h1>
    <div class="c-scroll" id="logList"></div>
  </div>

  <!-- ====== 전화번호부 ====== -->

      <h1 class="m-title">전화번호부</h1>
      <div class="c-scroll" id="cList"></div>

      <button class="back-link" id="cBack" type="button">‹ 전화번호부</button>

        <div class="cd-actions">

          </button>
          <button class="act" id="actCall" type="button">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>전화

            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16.5 10.5L21 7.5v9l-4.5-3z"/></svg>FaceTime

  <!-- ====== 키패드 ====== -->

  <div class="app-home" id="closePhone" aria-label="홈으로"><i></i></div>

let lastW = innerWidth;
function fit(){
  document.documentElement.style.setProperty('--s', Math.min(innerWidth/393, innerHeight/852));
}
fit();
addEventListener('resize', () => {
  if (innerWidth !== lastW){ lastW = innerWidth; fit(); }   // 키보드로 높이만 변할 땐 무시
});

/* ====================================================

   ==================================================== */
const $ = id => document.getElementById(id);
const DAYS = ['일','월','화','수','목','금','토'];

function tick(){
  const d = new Date();
  let h = d.getHours();
  if (HOUR12) h = h % 12 || 12;
  const m = String(d.getMinutes()).padStart(2,'0');
  $('clock').textContent  = `${String(h).padStart(2,'0')}:${m}`;   // 잠금화면
  $('sbTime').textContent = `${h}:${m}`;                           // 상단 상태바
  $('date').textContent   = `${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
  tickHome(d);                                                     // 홈화면 날짜·시계 아이콘
}
tick();
setInterval(tick, 1000);

function show(id){
  ['lock','home','phoneApp','msgApp','kakaoApp','cameraApp','genApp'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  $('status').classList.toggle('dark', id === 'kakaoApp' || (id === 'genApp' && genLight));      // 밝은 앱에서는 검은 상태바
}

function setBattery(n){
  n = Math.max(0, Math.min(100, Math.round(n)));
  $('battNum').textContent = n;
  $('battFill').style.width = n + '%';
  $('battFill').classList.toggle('low', n <= 20);
}

   6. 잠금화면: 이름 입력 → 로딩 → 홈화면
   ==================================================== */
const input = $('answer'), widget = $('widget'), msgEl = $('msg');
let userName = '';

function reject(text){
  msgEl.textContent = text;
  widget.classList.remove('shake');
  void widget.offsetWidth;
  widget.classList.add('shake');
  input.focus();
}

function submit(){
  const name = input.value.replace(/\s/g,'');
  if (!name){ reject(''); return; }
  if (!Object.prototype.hasOwnProperty.call(NAMES, name)){ reject(NOT_FOUND_MSG); return; }

const KEYS = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],
              ['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];

function fmt(d){                    // 화면에 보이는 번호 모양 (000-0000-0000)
  if (/[*#]/.test(d) || d.length <= 3) return d;
  if (d.length <= 7) return d.slice(0,3) + '-' + d.slice(3);
  return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
}
function renderNum(){
  $('numDisplay').textContent = fmt(digits);
  $('delBtn').classList.toggle('show', digits.length > 0);
}
function addDigit(n){ if (digits.length < 15){ digits += n; renderNum(); } }
function delDigit(){ digits = digits.slice(0,-1); renderNum(); }

   9. 전화 걸기
   ==================================================== */
let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

let callFromKeypad = false;

function startCall(contact){
  let name, script, extra = '';
  if (contact){                                   // 전화번호부에서 건 전화
    callFromKeypad = false;
    name = contact.name; script = nextScript(contact);
  } else {                                        // 키패드에서 건 전화
    if (!digits) return;
    callFromKeypad = true;
    const found = contacts.find(c => c.number.replace(/\D/g,'') === digits);
    if (found){                                   // 저장된 번호를 직접 눌러도 그 사람에게 걸림
      name = found.name; script = nextScript(found);
    } else {
      const isNum = /^[0-9]+$/.test(digits);
      const valid = isNum && digits.length === CALL.numberLength;
      name   = valid ? CALL.unsavedName : fmt(digits);
      extra  = valid ? fmt(digits) : '';
      script = valid ? CALL.answers[Math.floor(Math.random() * CALL.answers.length)] : CALL.invalid;
    }
  }
  addCallLog(name, extra);
  runCall(name, script);
}

function runCall(name, script){
  clearTimers();
  $('callName').textContent = name;
  $('callSub').textContent  = '발신 중...';
  $('callLine').textContent = '';
  $('call').classList.remove('hidden');

  if (!script){                                   // 전화를 받지 않음
    later(() => { $('callSub').textContent = '응답 없음'; }, CALL.ringMs + 2500);
    later(finishCall, CALL.ringMs + 3500);
    return;
  }
  later(() => { $('callSub').textContent = '통화 중'; }, CALL.ringMs);
  script.forEach((txt, i) => later(() => { $('callLine').textContent = txt; }, CALL.ringMs + i * CALL.lineMs));
  later(finishCall, CALL.ringMs + script.length * CALL.lineMs + 600);   // 마지막 대사 후 종료
}

function finishCall(){
  clearTimers();
  $('callSub').textContent = '통화 종료';
  later(closeCall, 1400);
}

function closeCall(){
  clearTimers();
  $('call').classList.add('hidden');
  if (callFromKeypad){ digits = ''; renderNum(); }
}

$('endBtn').addEventListener('click', () => {      // 통화 중 직접 끊기
  clearTimers();
  $('callSub').textContent = '통화 종료';
  later(closeCall, 600);
});

const pad = n => String(n).padStart(2,'0');
function parseAt(str){                          // '10/25 17:30' → 날짜 (연도는 올해)
  const m = str.match(/(\d+)\/(\d+)\s+(\d+):(\d+)/);
  return new Date(new Date().getFullYear(), +m[1]-1, +m[2], +m[3], +m[4]);
}
const headText = d => `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  }));

}

function unreadCount(){

    if (!prev || m.ts - prev > 3600000 || prev.toDateString() !== m.ts.toDateString()) body.appendChild(el('div','t-time',headText(m.ts)));  // 날짜가 바뀌거나 1시간 이상 간격이면 날짜·시간 표시

function updateSend(){ $('tSend').classList.toggle('on', $('tInput').value.trim().length > 0); }

function sendMsg(){
  const text = $('tInput').value.trim();
  if (!text || openIdx < 0) return;
  const t = threads[openIdx];
  t.msgs.push({ from: 'me', text, ts: new Date(), read: true });
  $('tInput').value = '';
  updateSend();

  const flat = text.replace(/\s/g,'');
  const rule = t.replies.find(r => r.keys.some(k => flat.includes(k.replace(/\s/g,''))));
  if (rule) pending++;
  renderThread();

  if (rule) setTimeout(() => {
    pending = Math.max(0, pending - 1);
    const viewing = openIdx === threads.indexOf(t) &&
                    !$('msgApp').classList.contains('hidden') && $('m-thread').classList.contains('on');
    t.msgs.push({ from: 'them', text: rule.text, ts: new Date(), read: viewing });
    updateBadge();
    renderLog();
    if (viewing) renderThread(); else if ($('m-list').classList.contains('on')) renderList();
  }, REPLY_MS);
}

/* ====================================================
   11. 전화번호부 (즐겨찾기 → ㄱㄴㄷ순)
   ==================================================== */
const INITIALS = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const DOUBLE  = { 'ㄲ':'ㄱ', 'ㄸ':'ㄷ', 'ㅃ':'ㅂ', 'ㅆ':'ㅅ', 'ㅉ':'ㅈ' };
const ORDER   = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ']
                  .concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), ['#']);
let contacts = [], curContact = null;

function initial(name){ return Array.from(String(name).trim())[0] || '?'; }

function groupKey(name){
  const ch = initial(name), c = ch.charCodeAt(0);
  if (c >= 0xAC00 && c <= 0xD7A3){
    const ini = INITIALS[Math.floor((c - 0xAC00) / 588)];
    return DOUBLE[ini] || ini;
  }
  if (/[A-Za-z]/.test(ch)) return ch.toUpperCase();
  return '#';
}
const byName = (a, b) => a.name.localeCompare(b.name, 'ko');

/* 통화 대사 정리: call 에 대사 배열 하나 → 매번 같은 대사
   [[1번째 통화 대사], [다시 걸면], [또다시 걸면]] → 걸 때마다 다음 대사 (마지막은 계속 반복)
   call 을 비우면 전화를 걸어도 받지 않음 */
function callAttempts(call){
  if (!call || !call.length) return [];
  return Array.isArray(call[0]) ? call : [call];
}
function nextScript(c){
  if (!c.calls.length) return null;                       // 안 받음
  const s = c.calls[Math.min(c.tries, c.calls.length - 1)];
  c.tries++;
  return s;
}

function loadContacts(cfg){
  contacts = (cfg.contacts || []).map(c => ({
    name: c.name, number: c.number || '', favorite: !!c.favorite,
    calls: callAttempts(c.call), tries: 0,
    replies: c.replies || []
  }));
  backToContactList();
}

function contactRow(c){
  const row = el('button','c-row'); row.type = 'button';
  row.appendChild(el('span','avatar sm', initial(c.name)));
  row.appendChild(el('span','c-name', c.name));
  row.addEventListener('click', () => openContact(c));
  return row;
}

function renderContacts(){
  const box = $('cList');
  box.innerHTML = '';
  if (!contacts.length){ box.appendChild(el('div','m-empty','연락처 없음')); return; }

  const favs = contacts.filter(c => c.favorite).sort(byName);
  if (favs.length){
    box.appendChild(el('div','c-sec','즐겨찾기'));
    favs.forEach(c => box.appendChild(contactRow(c)));
  }
  const groups = {};
  contacts.forEach(c => { const k = groupKey(c.name); (groups[k] = groups[k] || []).push(c); });
  ORDER.filter(k => groups[k]).forEach(k => {
    box.appendChild(el('div','c-sec',k));
    groups[k].sort(byName).forEach(c => box.appendChild(contactRow(c)));
  });
}

function openContact(c){
  curContact = c;
  $('cdAvatar').textContent = initial(c.name);
  $('cdName').textContent   = c.name;
  $('cdNum').textContent    = c.number;
  $('c-list').classList.remove('on');
  $('c-detail').classList.add('on');
}

function backToContactList(){
  curContact = null;
  $('c-detail').classList.remove('on');
  $('c-list').classList.add('on');
  renderContacts();
}

function openMessagesWith(c){                      // 했던 문자로 연결 (없으면 새 대화)
  let idx = threads.findIndex(t => t.name === c.name);
  if (idx < 0){ threads.push({ name: c.name, replies: c.replies, msgs: [] }); idx = threads.length - 1; }
  show('msgApp');
  openThread(idx);
}

const ICON_CALL = 'M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z';

  const box = $('logList');

  })));
  if (!items.length){ box.appendChild(el('div','m-empty','기록 없음')); return; }

  items.sort((a,b) => a.ts - b.ts);   // 오래된 순 (최신순으로 되돌리려면 a.ts - b.ts 를 b.ts - a.ts 로)

    sub.innerHTML = `<svg viewBox="0 0 24 24"><path d="${e.type === 'call' ? ICON_CALL : ICON_MSG}"/></svg>`;
    const label = e.type === 'call'

      : (e.dir === 'out' ? '보낸 문자' : '받은 문자') + ' · ' + e.text;
    sub.appendChild(el('span','',label));
    tx.appendChild(sub);
    row.appendChild(tx);

    row.appendChild(el('span','l-time',
      `${e.ts.getMonth()+1}/${e.ts.getDate()} ${pad(e.ts.getHours())}:${pad(e.ts.getMinutes())}`));
    box.appendChild(row);
  });
}

function kAv(name, extra){            // 카카오 프로필 사진: img 가 있으면 그 사진, 없으면 기본 프로필
  const f = kk.friends.find(x => x.name === name) || (kk.me.name === name ? kk.me : null);
  const a = el('span','avatar kav ' + (extra || ''));
  if (f && f.img) a.style.backgroundImage = `url("${String(f.img).replace(/"/g,'%22')}")`;
  else a.innerHTML = KAV_SVG;

}

let kk = { me: { name: '', status: '' }, pay: 0, friends: [], chats: [], openIdx: -1, pending: 0 };

function kTime(d){ const h = d.getHours(); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${pad(d.getMinutes())}`; }
function kDate(d){ return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`; }
function sortKo(arr){                                 // ㄱㄴㄷ순 (한글 → 영문 → 기타)
  return arr.slice().sort((a,b) => {
    const d = ORDER.indexOf(groupKey(a.name)) - ORDER.indexOf(groupKey(b.name));
    return d || a.name.localeCompare(b.name, 'ko');
  });
}

function loadKakao(cfg){

  kk.chats = (k.chats || []).map(t => ({

    msgs: t.msgs.map(m => ({ from: m.from, text: m.text, ts: parseAt(m.at), read: !m.unread }))
  }));
  kk.openIdx = -1; kk.pending = 0;

function kUnread(){
  return kk.chats.reduce((n,t) => n + t.msgs.filter(m => m.from === 'them' && !m.read).length, 0);
}
function updateKakaoBadge(){
  const n = kUnread();
  [$('kakaoBadge'), $('kTabBadge')].forEach(b => { b.textContent = n; b.hidden = n === 0; });
}

function renderKakaoChats(){
  const box = $('kChats');
  box.innerHTML = '';
  if (!kk.chats.some(t => t.msgs.length)){ box.appendChild(el('div','k-empty','메시지 없음')); return; }
  kk.chats.forEach((t,i) => {
    if (!t.msgs.length) return;
    const last = t.msgs[t.msgs.length-1];
    const unread = t.msgs.filter(m => m.from === 'them' && !m.read).length;
    const row = el('button','k-chat'); row.type = 'button';
    row.appendChild(kAv(t.name));
    const ct = el('div','k-ct');

/* ---- 대화방 ---- */
function renderKRoom(){
  const t = kk.chats[kk.openIdx];
  const body = $('kRBody');
  body.innerHTML = '';
  let prev = null;
  t.msgs.forEach(m => {
    const newDay = !prev || prev.ts.toDateString() !== m.ts.toDateString();
    if (newDay) body.appendChild(el('div','k-date', kDate(m.ts)));
    const mine = m.from === 'me';
    const first = newDay || prev.from !== m.from;
    const row = el('div','k-msg ' + (mine ? 'me' : 'them'));
    if (!mine){
      const av = kAv(t.name);
      if (!first) av.style.visibility = 'hidden';
      row.appendChild(av);
    }
    const col = el('div','k-col');
    if (!mine && first) col.appendChild(el('div','k-who', t.name));
    const line = el('div','k-line');
    const bub = el('div','k-bub', m.text), tm = el('span','k-tm', kTime(m.ts));
    if (mine){ line.appendChild(tm); line.appendChild(bub); } else { line.appendChild(bub); line.appendChild(tm); }
    col.appendChild(line);
    row.appendChild(col);
    body.appendChild(row);
    prev = m;
  });
  if (kk.pending > 0){
    const ty = el('div','k-typing'); ty.innerHTML = '<i></i><i></i><i></i>';
    body.appendChild(ty);
  }
  body.scrollTop = body.scrollHeight;
}

function openKRoom(i){
  kk.openIdx = i;
  kk.chats[i].msgs.forEach(m => { m.read = true; });      // 열면 읽음 처리, 목록 배지도 사라짐
  updateKakaoBadge();
  $('kRName').textContent = kk.chats[i].name;
  $('k-room').classList.add('on');
  renderKRoom();
}

function closeKRoom(){
  kk.openIdx = -1;
  $('k-room').classList.remove('on');
  renderKakaoChats();
}

function updateKSend(){ $('kSend').classList.toggle('on', $('kInput').value.trim().length > 0); }

function sendK(){
  const text = $('kInput').value.trim();
  if (!text || kk.openIdx < 0) return;
  const t = kk.chats[kk.openIdx];
  t.msgs.push({ from: 'me', text, ts: new Date(), read: true });
  $('kInput').value = '';
  updateKSend();

  const flat = text.replace(/\s/g,'');
  const rule = t.replies.find(r => r.keys.some(k => flat.includes(k.replace(/\s/g,''))));
  if (rule) kk.pending++;
  renderKRoom();

  if (rule) setTimeout(() => {
    kk.pending = Math.max(0, kk.pending - 1);
    const viewing = kk.openIdx === kk.chats.indexOf(t) &&
                    !$('kakaoApp').classList.contains('hidden') && $('k-room').classList.contains('on');
    t.msgs.push({ from: 'them', text: rule.text, ts: new Date(), read: viewing });
    updateKakaoBadge();
    if (viewing) renderKRoom(); else renderKakaoChats();
  }, REPLY_MS);
}

/* ====================================================
   16. 음악 위젯 (유튜브 링크 재생)
   ==================================================== */
const MUSIC = { url:'', id:'', title:'', artist:'', autoTitle:'', autoArtist:'', player:null, ready:false, playing:false, failed:false };
const fmtT = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function ytId(u){
  const m = String(u || '').match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

let ytCbs = [], ytLoading = false;
function loadYT(cb){
  if (window.YT && window.YT.Player){ cb(); return; }
  ytCbs.push(cb);
  if (ytLoading) return;
  ytLoading = true;
  window.onYouTubeIframeAPIReady = () => { ytCbs.splice(0).forEach(f => f()); };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { MUSIC.failed = true; };
  document.head.appendChild(s);
}

function showMeta(){                            // 제목·가수: 직접 적은 값 > 유튜브 정보 > 기본 문구
  $('mwTitle').textContent  = MUSIC.title  || MUSIC.autoTitle  || '노래 제목';
  $('mwArtist').textContent = MUSIC.artist || MUSIC.autoArtist || '가수';
}
function flashMusic(t){ $('mwArtist').textContent = t; setTimeout(showMeta, 2200); }

function initMusic(m){
  MUSIC.url = m.url || ''; MUSIC.id = ytId(m.url);
  MUSIC.title = m.title || ''; MUSIC.artist = m.artist || '';
  MUSIC.autoTitle = ''; MUSIC.autoArtist = '';
  MUSIC.ready = false; MUSIC.playing = false; MUSIC.failed = false;
  showMeta();
  const cv = $('mwCover');
  cv.style.background = m.cover ? `url("${String(m.cover).replace(/"/g,'%22')}") center/cover` : (m.color || '#e0526b');
  if (m.cover) cv.innerHTML = '';
  paintMusic();
  if (!MUSIC.id) return;
  loadYT(() => {
    const old = $('ytHost'); if (old) old.remove();
    if (MUSIC.player){ try { MUSIC.player.destroy(); } catch (e) {} MUSIC.player = null; }
    const host = el('div'); host.id = 'ytHost';
    const inner = el('div'); inner.id = 'ytP';
    host.appendChild(inner); $('phone').appendChild(host);
    MUSIC.player = new YT.Player('ytP', {
      width: '200', height: '200', videoId: MUSIC.id,
      playerVars: { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => {
          MUSIC.ready = true;
          try {                                    // 제목·가수를 비워두면 유튜브 정보로 자동 채움
            const d = MUSIC.player.getVideoData();
            if (d && d.title)  MUSIC.autoTitle  = d.title;
            if (d && d.author) MUSIC.autoArtist = d.author;
          } catch (e) {}
          showMeta();
        },
        onStateChange: e => { MUSIC.playing = (e.data === 1); paintMusic(); },
        onError: () => { MUSIC.failed = true; flashMusic('재생할 수 없는 영상이에요'); }
      }
    });
  });
}

function paintMusic(){
  const p = MUSIC.player;
  let cur = 0, dur = 0;
  if (p && MUSIC.ready){ try { cur = p.getCurrentTime() || 0; dur = p.getDuration() || 0; } catch (e) {} }
  $('mwFill').style.width = dur ? (Math.min(cur / dur, 1) * 100) + '%' : '0%';
  $('mwCur').textContent = fmtT(cur);
  $('mwDur').textContent = dur ? fmtT(dur) : '-:--';
  $('mwIcon').innerHTML = MUSIC.playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M6 4l14 8-14 8z"/>';
}

function toggleMusic(){
  const p = MUSIC.player;
  if (p && MUSIC.ready && !MUSIC.failed){
    if (MUSIC.playing) p.pauseVideo(); else p.playVideo();
    return;
  }
  flashMusic(MUSIC.failed ? '재생할 수 없어요' : (MUSIC.id ? '불러오는 중이에요' : '노래 링크가 없어요'));
}
function pauseMusic(){ try { if (MUSIC.player && MUSIC.ready && MUSIC.playing) MUSIC.player.pauseVideo(); } catch (e) {} }

function seekMusic(e){
  const p = MUSIC.player;
  if (!(p && MUSIC.ready)) return;
  const r = e.currentTarget.getBoundingClientRect();
  try {
    const d = p.getDuration();
    if (d) p.seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d, true);
  } catch (err) {}
}

/* 유튜브 영상 정보(제목·채널)를 링크에서 자동으로 가져옴 (유튜브 oEmbed). 직접 적은 값이 우선.
   썸네일도 링크에서 가져옴. 조회수·업로드일은 가져올 수 없어 meta 에 직접 적기 */
const YT_META = {};
function ytMeta(id, cb){
  if (YT_META[id]){ if (YT_META[id].ok) cb(YT_META[id]); return; }
  YT_META[id] = { ok: false, cbs: [cb] };
  fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id))
    .then(r => r.json())
    .then(j => { const m = YT_META[id]; m.ok = true; m.title = j.title || ''; m.channel = j.author_name || ''; m.cbs.forEach(f => f(m)); })
    .catch(() => { delete YT_META[id]; });
}
const ytThumb = id => `url("https://i.ytimg.com/vi/${id}/hqdefault.jpg") center/cover no-repeat`;

    vids.forEach(v => {
      const b = el('button','yt-v' + (ytId(v.url) ? ' link' : '')); b.type = 'button';
      const vid = ytId(v.url);
      const th = el('div','yt-th'); th.style.background = v.color || '#2a2a2e';
      if (vid && !v.color) th.style.background = ytThumb(vid) + ', #2a2a2e';
      if (v.length) th.appendChild(el('span','yt-len',v.length));
      const prog = Math.max(0, Math.min(1, Number(v.progress) || 0));
      if (prog > 0){
        const pg = el('div','yt-pg'); const i = el('i'); i.style.width = (prog * 100) + '%';

      }
      b.appendChild(th);

      const tx = el('div');

      tx.appendChild(tEl);
      const seen = prog >= 1 ? '시청 완료' : (prog > 0 ? '이어서 시청' : '');
      const paint = ch => { mEl.textContent = [ch, v.meta, seen].filter(Boolean).join(' · '); };
      paint(v.channel || '');
      tx.appendChild(mEl);
      info.appendChild(tx); b.appendChild(info);
      if (vid && (!v.title || !v.channel)) ytMeta(vid, m => {
        if (!v.title) tEl.textContent = m.title;

        avEl.textContent = initial(ch || m.title || '?');
        v._t = v.title || m.title; v._c = ch;
      });
      if (ytId(v.url)) b.addEventListener('click', () => watch(v));
      sc.appendChild(b);
    });

    loadYT(() => {
      if (!host.isConnected) return;
      ytVideoPlayer = new YT.Player('ytWatch', {
        width: '100%', height: '100%', videoId: ytId(v.url),

    const t = el('div','t');
    r.appendChild(l); r.appendChild(t); card.appendChild(r);
    return { z, sub, t };
  });
  const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  function upd(){
    const now = new Date();
    const loc = new Date(now.toLocaleString('en-US'));
    rows.forEach(({ z, sub, t }) => {
      let x = loc;
      try { x = new Date(now.toLocaleString('en-US', { timeZone: z.tz })); } catch (e) {}
      const diff = (x - loc) / 3600000;
      const dd = Math.round((dayStart(x) - dayStart(loc)) / 86400000);
      sub.textContent = `${['어제','오늘','내일'][dd + 1] || '오늘'}, ${diff >= 0 ? '+' : ''}${+diff.toFixed(1)}시간`;
      const a = ap12(x.getHours(), x.getMinutes());
      t.innerHTML = `<small>${a.ap}</small>${a.t}`;
    });
  }
  upd(); gTimer(upd, 1000);
}

function clockAlarm(body){
  body.appendChild(el('div','ga-title','알람'));
  const alarms = (CUR.alarms || []).map(a => ({ time: a.time, label: a.label || '알람', on: a.on !== false }));
  if (!alarms.length){ body.appendChild(gEmpty('알람 없음','')); return; }
  const sc = gScroll(body);
  const card = el('div','ga-card'); sc.appendChild(card);
  alarms.forEach(a => {
    const r = el('div','ga-row');
    const l = el('div','l');
    const [h, m] = a.time.split(':').map(Number);
    const p = ap12(h, m);
    const t = el('div','al-t'); t.innerHTML = `<small>${p.ap}</small>${p.t}`;
    const lb = el('div','nt-s',a.label);
    l.appendChild(t); l.appendChild(lb);
    const sw = el('button','sw' + (a.on ? ' on' : '')); sw.type = 'button';
    const paint = () => { sw.classList.toggle('on', a.on); t.classList.toggle('off', !a.on); lb.classList.toggle('off', !a.on); };
    sw.addEventListener('click', () => { a.on = !a.on; paint(); });
    paint();
    r.appendChild(l); r.appendChild(sw); card.appendChild(r);
  });
}

function clockStop(body){
  let run = false, start = 0, acc = 0, mark = 0, laps = [];
  const fmt = ms => `${pad(Math.floor(ms / 60000))}:${pad(Math.floor(ms / 1000) % 60)}.${pad(Math.floor(ms / 10) % 100)}`;
  const cur = () => acc + (run ? performance.now() - start : 0);
  const disp = el('div','sw-d','00:00.00');
  const bs = el('div','sw-bs');
  const bl = el('button','sw-b gray','랩'), br = el('button','sw-b green','시작');
  bl.type = br.type = 'button';
  bs.appendChild(bl); bs.appendChild(br);
  const sc = gScroll(body);
  body.insertBefore(disp, sc); body.insertBefore(bs, sc);
  function ui(){
    br.textContent = run ? '중단' : '시작';
    br.className = 'sw-b ' + (run ? 'red' : 'green');
    bl.textContent = run ? '랩' : '재설정';
    bl.disabled = !run && cur() === 0;
  }
  function drawLaps(){
    sc.innerHTML = '';
    laps.forEach((ms, i) => {
      const r = el('div','lap');
      r.appendChild(el('span','',`랩 ${laps.length - i}`));
      r.appendChild(el('span','',fmt(ms)));
      sc.appendChild(r);
    });
  }
  br.addEventListener('click', () => {
    if (run){ acc += performance.now() - start; run = false; } else { start = performance.now(); run = true; }
    ui(); disp.textContent = fmt(cur());
  });
  bl.addEventListener('click', () => {
    if (run){ const c = cur(); laps.unshift(c - mark); mark = c; }
    else { acc = 0; mark = 0; laps = []; }
    drawLaps(); ui(); disp.textContent = fmt(cur());
  });
  gTimer(() => { disp.textContent = fmt(cur()); }, 30);
  ui();
}

function clockTimer(body){
  body.appendChild(el('div','ga-title','타이머'));
  const disp = el('div','sw-d','00:00:00');
  disp.style.fontSize = '64px';
  body.appendChild(disp);
  const inp = {};
  const box = el('div','tm-in');
  [['h','시간',0],['m','분',1],['s','초',0]].forEach(([k, lab, v]) => {
    const lb = el('label','',lab);
    const i = el('input'); i.type = 'number'; i.min = 0; i.max = 99; i.value = v; i.inputMode = 'numeric';
    inp[k] = i; lb.insertBefore(i, lb.firstChild); box.appendChild(lb);
  });
  body.appendChild(box);
  const bs = el('div','sw-bs');
  const bc = el('button','sw-b gray','취소'), bg = el('button','sw-b green','시작');
  bc.type = bg.type = 'button';
  bs.appendChild(bc); bs.appendChild(bg);
  body.appendChild(bs);
  let end = 0, running = false;
  const n = k => Math.max(0, Math.min(99, parseInt(inp[k].value, 10) || 0));
  const fmt = ms => { const s = Math.ceil(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
  function stop(){ running = false; bg.textContent = '시작'; bg.className = 'sw-b green'; }
  bg.addEventListener('click', () => {
    if (running){ stop(); return; }
    const ms = (n('h') * 3600 + n('m') * 60 + n('s')) * 1000;
    if (!ms) return;
    end = performance.now() + ms; running = true;
    bg.textContent = '일시 정지'; bg.className = 'sw-b red';
    disp.textContent = fmt(ms);
  });
  bc.addEventListener('click', () => { stop(); disp.textContent = '00:00:00'; });
  gTimer(() => {
    if (!running) return;
    const left = end - performance.now();
    if (left <= 0){ stop(); disp.textContent = '00:00:00'; }
    else disp.textContent = fmt(left);
  }, 100);
}
